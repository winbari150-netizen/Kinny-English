<!DOCTYPE html>
<html lang="ta" translate="no" class="notranslate"><head><meta charset="utf-8"><meta name="google" content="notranslate"><meta http-equiv="Content-Language" content="ta">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kinny English</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Noto+Sans+Tamil:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#fff3d6;--bg2:#e6f0ff;--card:#fff;--ink:#2b2d52;--mut:#6b6f9a;--pri:#7c4dff;--acc:#ff7a59;--ok:#25b37a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg1:#221d3d;--bg2:#12203d;--card:#2c2a52;--ink:#f3f1ff;--mut:#b4b2e0}}
html,body{margin:0;height:100%}*{box-sizing:border-box}
body{font-family:"Baloo 2","Noto Sans Tamil",system-ui,sans-serif;background:linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;color:var(--ink);padding-bottom:20px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:10px 12px 6px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);box-shadow:0 4px 18px #7c4dff22;border-radius:0 0 24px 24px}
header b{font-size:22px;flex:1;line-height:1}header small{display:block;font-size:12px;color:var(--mut);font-weight:500}
.gsel{display:flex;gap:4px}.gsel button{width:34px;height:34px;border-radius:50%;border:0;background:#7c4dff1f;color:var(--ink);font:700 16px inherit;font-family:inherit;cursor:pointer}.gsel button.on{background:var(--pri);color:#fff;transform:scale(1.12)}
main{max-width:860px;margin:0 auto;padding:16px}
h2{margin:6px 0 12px;font-size:26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.card{background:var(--card);border-radius:22px;padding:14px;box-shadow:0 6px 16px #7c4dff1c;text-align:center;border:0;color:var(--ink);font-family:inherit;cursor:pointer;transition:transform .15s}
.card:active{transform:scale(.94)}.card .e{font-size:42px;display:block}.card b{font-size:18px}
.menu .card:nth-child(5n+1){background:#ffe0e0}.menu .card:nth-child(5n+2){background:#fff0c9}.menu .card:nth-child(5n+3){background:#d9f6e5}.menu .card:nth-child(5n+4){background:#dbe9ff}.menu .card:nth-child(5n){background:#eadcff}
.menu .card{color:#2b2d52}
.hero{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#7c4dff,#ff7a59);color:#fff;border-radius:28px;padding:18px;margin-bottom:16px;box-shadow:0 10px 26px #7c4dff44}
.hero img{width:112px;height:auto;flex:none;border-radius:50%;background:#fff;box-shadow:0 6px 16px #0003;animation:bob 2.4s ease-in-out infinite}.hero h1{margin:0;font-size:26px;line-height:1.15}.hero p{margin:4px 0 0}
@keyframes bob{50%{transform:translateY(-6px) rotate(3deg)}}
.btn{border:0;border-radius:999px;padding:10px 18px;font:700 16px "Baloo 2","Noto Sans Tamil",sans-serif;background:var(--pri);color:#fff;cursor:pointer;box-shadow:0 4px 0 #5b36c4}
.btn.o{background:var(--acc);box-shadow:0 4px 0 #c9532f}.btn.g{background:var(--ok);box-shadow:0 4px 0 #168659}.btn:active{transform:translateY(3px);box-shadow:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.chip{border:2px solid var(--pri);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font:600 15px "Baloo 2","Noto Sans Tamil",sans-serif;cursor:pointer}.chip.on{background:var(--pri);color:#fff}
.big{font-size:40px;font-weight:700;color:var(--pri)}
.w{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:20px;padding:10px 14px;margin-bottom:10px;box-shadow:0 4px 12px #7c4dff14;flex-wrap:wrap}
.w .em{font-size:38px}.w .t{flex:1;min-width:120px}.w .t b{font-size:22px;display:block}.w .t span{color:var(--mut)}
.sp span{display:inline-block;min-width:1ch;margin:0 4px;font-size:26px;font-weight:700;transition:.2s}.sp span.hl{color:var(--acc);transform:scale(1.5)}
.line{background:var(--card);border-radius:18px;padding:10px 14px;margin:8px 0;max-width:92%;box-shadow:0 3px 10px #7c4dff14;border-left:6px solid var(--pri)}
.line.b{margin-left:auto;border-left:0;border-right:6px solid var(--acc)}.line.hl{outline:3px solid var(--ok)}.line small{display:block;color:var(--mut)}
.board{position:relative;width:min(100%,420px);aspect-ratio:1;margin:8px auto;background:#fff;border-radius:26px;box-shadow:0 8px 24px #7c4dff33;border:4px dashed #b9a4ff;overflow:hidden}
.board canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #0003;cursor:pointer}.sw.on{transform:scale(1.25);box-shadow:0 0 0 3px var(--ink)}
textarea{width:100%;min-height:110px;border-radius:18px;border:3px solid var(--pri);padding:12px;font:18px "Noto Sans Tamil","Baloo 2",sans-serif;background:var(--card);color:var(--ink)}
.out{background:var(--card);border-radius:18px;padding:14px;margin-top:10px;font-size:20px;min-height:56px}
.opt{display:block;width:100%;margin:8px 0;text-align:left;font-size:20px}.opt.ok{background:#bff0d8!important;color:#0b5b3c}.opt.no{background:#ffd0d0!important;color:#7a1d1d}
nav{flex:0 0 100%;display:flex;gap:4px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
nav button{flex:none;min-width:68px;border:0;background:none;color:var(--mut);font:600 12px "Baloo 2","Noto Sans Tamil",sans-serif;border-radius:14px;padding:4px 6px;cursor:pointer}nav button i{display:block;font-style:normal;font-size:20px}nav button.on{background:#7c4dff22;color:var(--pri)}
.pop{animation:pop .5s}@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.muted{color:var(--mut)}.load{animation:bob 1s infinite;display:inline-block}
</style>

function voice(){const v=speechSynthesis.getVoices().filter(x=>/^en/i.test(x.lang));return v.find(x=>/samantha|zira|aria|jenny|karen|moira|susan|female|google us english|google uk english female/i.test(x.name))||v[0]}
